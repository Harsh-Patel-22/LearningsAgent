version: "3.9"

# ══════════════════════════════════════════════════════════
# COGNITIVE MEMORY OPERATING SYSTEM
# Production Docker Compose Stack
#
# Services:
#   postgres   — structured relational data (memory objects, patterns, etc.)
#   qdrant     — vector database (4 embedding space collections)
#   neo4j      — knowledge graph (memory relationships, causal chains)
#   redis      — caching + task queue
#   api        — FastAPI application (all 5 phases)
#   worker     — Celery background worker (ingestion, analysis jobs)
#   beat       — Celery periodic scheduler (weekly analysis, reflections)
#   nginx      — reverse proxy
# ══════════════════════════════════════════════════════════

services:

  # ── DATABASES ──────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: cmos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmos}
      POSTGRES_USER: ${POSTGRES_USER:-cmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmos_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cmos_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - ./docker/qdrant/config.yaml:/qdrant/config/production.yaml
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.15-community
    container_name: cmos_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cmos_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 20s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cmos_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-cmos_redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── APPLICATION ─────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    container_name: cmos_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-cmos}:${POSTGRES_PASSWORD:-cmos_secure_password}@postgres:5432/${POSTGRES_DB:-cmos}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-cmos_neo4j_password}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-cmos_redis_password}@redis:6379/0
      - CMOS_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    container_name: cmos_worker
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - qdrant
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-cmos}:${POSTGRES_PASSWORD:-cmos_secure_password}@postgres:5432/${POSTGRES_DB:-cmos}
      - QDRANT_HOST=qdrant
      - NEO4J_URL=bolt://neo4j:7687
      - REDIS_URL=redis://:${REDIS_PASSWORD:-cmos_redis_password}@redis:6379/0
    command: celery -A api.tasks worker --loglevel=info --concurrency=2 -Q ingestion,analysis,reflections

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    container_name: cmos_beat
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-cmos_redis_password}@redis:6379/0
    command: celery -A api.tasks beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ── OBSERVABILITY ───────────────────────────────────────

  langfuse:
    image: langfuse/langfuse:latest
    container_name: cmos_langfuse
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmos}:${POSTGRES_PASSWORD:-cmos_secure_password}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:-changeme}
      SALT: ${LANGFUSE_SALT:-changeme}
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    profiles:
      - observability

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  redis_data:

networks:
  default:
    name: cmos_network
